services:
  ore:
    # Immagine pubblicata da GitHub Actions.
    image: ghcr.io/hunt3rsgames/ore:latest
    # Per buildare in locale: decommenta "build" e commenta "image".
    # build: .
    container_name: ore
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      TZ: Europe/Rome
      # Facoltativo: se omesso viene generato e salvato in /data/.jwt_secret
      # JWT_SECRET: "cambia-con-una-stringa-lunga-e-casuale"
      # Utente creato al primo avvio (solo se il database è vuoto)
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "cambia-questa-password"
      # Metti "false" dopo aver creato gli account che ti servono
      ALLOW_REGISTRATION: "true"
    volumes:
      - ./data:/data
